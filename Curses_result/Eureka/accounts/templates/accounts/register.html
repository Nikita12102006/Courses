<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{% static 'main/css/st1.css' %}">
</head>
<body>
    <div class="div1">
        <p><img src="{% static 'main/img/logosite6.jpg' %}" alt="логотип" class="img1"></p>
        <h2>Регистрация</h2>
        <form method="post">
            {% csrf_token %}
            <div class="input-container">
                <label for="id_username">Имя пользователя:</label>
                <input type="text" id="id_username" name="username" placeholder="Ваше имя пользователя" required autofocus class="custom-input-style">

                <label for="id_email">Электронная почта:</label>
                <input type="email" id="id_email" name="email" placeholder="Ваша электронная почта" required class="custom-input-style">

                <label for="id_password1">Пароль:</label>
                <input type="password" id="id_password1" name="password1" placeholder="Ваш пароль" required class="custom-input-style">

                <label for="id_password2">Подтверждение пароля:</label>
                <input type="password" id="id_password2" name="password2" placeholder="Повторите пароль" required class="custom-input-style">
            </div>
            <div>
                <button type="submit" class="btn btn-outline">Зарегистрироваться</button>
            </div>
        </form>
    </div>
</body>
</html>
