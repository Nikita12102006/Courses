<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эврика</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'main/css/st1.css' %}">
    <link rel="shortcut icon" href="logosite5.jpg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="div1">
        <p><img src="{% static 'main/img/logosite6.jpg' %}" alt="логотип" class="img1"></p>
        <h2>Вход в профиль</h2>
        <form method="post">
            {% csrf_token %}
            <div class="input-container">
                {{ form.as_p }}
            </div>
            <div>
                <button type="submit" class="btn btn-outline">Войти</button>
                <p></p>
                <a href="{% url 'register' %}" class="btn btn-primary">Создать профиль</a>
            </div>
        </form>
    </div>
</body>
</html>
